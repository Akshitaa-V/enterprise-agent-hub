[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-hub"
version = "0.1.0"
description = "LangGraph multi-agent system that answers questions across an ERP, a sales data warehouse, a legacy warehouse export and company policy documents."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "langchain-core>=1.6,<2",
  "langchain>=1.4,<2",
  "langfuse>=4.16,<5",
  "fastapi>=0.140",
  "uvicorn>=0.30",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
